name: Build and Release APK & IPA

on:
  push:
    tags:
      - 'v*' # Trigger on tags like v1.0.0, v2.1.3-beta, etc.

jobs:
  release:
    name: Build & Publish Release (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for creating GitHub Releases

    strategy:
      fail-fast: false
      matrix:
        flavor: [dev, staging, prod]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Create .env file for build
        run: cp .env.example .env

      # ── Firebase config per flavor ─────────────────────────────
      # dev/staging configs are committed (not secrets). prod comes
      # from the GOOGLE_SERVICES_JSON_PROD repository secret.
      - name: Decode prod google-services.json
        if: matrix.flavor == 'prod'
        env:
          GOOGLE_SERVICES_JSON_PROD: ${{ secrets.GOOGLE_SERVICES_JSON_PROD }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_PROD" ]; then
            echo "::warning::GOOGLE_SERVICES_JSON_PROD not set — building prod flavor without Firebase config"
          else
            echo "$GOOGLE_SERVICES_JSON_PROD" | base64 --decode > android/app/src/prod/google-services.json
          fi

      # Optional: Decode Keystore if secrets are provided by the forked repo
      - name: Decode Keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo $KEYSTORE_BASE64 | base64 --decode > android/app/key.jks

          # Create key.properties file required by android/app/build.gradle
          cat << EOF > android/key.properties
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=key.jks
          EOF

      - name: Build APK (release, flavor ${{ matrix.flavor }})
        run: flutter build apk --release --flavor ${{ matrix.flavor }}

      - name: Rename APK per flavor
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-${{ matrix.flavor }}-release.apk \
             "dist/rekanara-${VERSION}-${{ matrix.flavor }}.apk"
          ls -la dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/rekanara-*.apk

  release-ios:
    name: Build IPA (${{ matrix.flavor }})
    runs-on: macos-latest
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        flavor: [dev, staging, prod]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Create .env file for build
        run: cp .env.example .env

      # ── Firebase config per flavor (iOS) ──────────────────────
      # dev/staging plists are committed (not secrets). prod comes
      # from the GOOGLE_SERVICE_INFO_PLIST_PROD repository secret.
      - name: Decode prod GoogleService-Info.plist
        if: matrix.flavor == 'prod'
        env:
          GOOGLE_SERVICE_INFO_PLIST_PROD: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_PROD }}
        run: |
          if [ -z "$GOOGLE_SERVICE_INFO_PLIST_PROD" ]; then
            echo "::warning::GOOGLE_SERVICE_INFO_PLIST_PROD not set — building prod flavor without Firebase config"
          else
            echo "$GOOGLE_SERVICE_INFO_PLIST_PROD" | base64 --decode > ios/Runner/flavors/prod/GoogleService-Info.plist
          fi

      # Build unsigned iOS app (no Apple certificates required).
      # To produce a signed .ipa, provision signing certs/secrets and
      # switch to: flutter build ipa --release --flavor <flavor> \
      #   --export-options-plist=ios/ExportOptions.plist
      - name: Build iOS app (release, flavor ${{ matrix.flavor }}, no codesign)
        run: flutter build ios --release --flavor ${{ matrix.flavor }} --no-codesign

      - name: Package unsigned IPA per flavor
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p Payload dist
          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
          zip -qr "rekanara-${VERSION}-ios-${{ matrix.flavor }}.ipa" Payload
          mv "rekanara-${VERSION}-ios-${{ matrix.flavor }}.ipa" dist/
          ls -la dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/rekanara-*-ios-*.ipa
