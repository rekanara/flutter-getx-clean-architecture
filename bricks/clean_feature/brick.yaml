name: clean_feature
description: Generates a Clean Architecture feature module for rekanara_getx boilerplate.
version: 1.0.0
environment:
  mason: ">=0.1.0-dev.51 <0.1.0"
vars:
  feature_name:
    type: string
    description: "The name of the feature (snake_case, e.g. transaction_history)"
    default: "feature"
    prompt: "What is the feature name?"